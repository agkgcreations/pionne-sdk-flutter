name: pionne_flutter
description: >-
  Error monitoring SDK for Flutter — Pionne. Auto-captures Flutter framework
  errors, unhandled async errors, AND native crashes (NSException, signals,
  ANR, NDK, OOM) via MetricKit (iOS 14+) and ApplicationExitInfo (Android 11+).
  Ships rich runtime context (Dart version, OS, device, locale) and tracks
  Release Health (crash-free user rate per release).
version: 0.4.2
homepage: https://pionne.agkgcreations.fr
repository: https://github.com/agkgcreations/pionne-sdk-flutter
issue_tracker: https://github.com/agkgcreations/pionne-sdk-flutter/issues
topics:
  - error-monitoring
  - crash-reporting
  - observability
  - pionne

environment:
  sdk: ^3.0.0
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: PionnePlugin
      android:
        package: fr.pionne.flutter
        pluginClass: PionnePlugin
